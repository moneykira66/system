name: Build SYSTEM OF KIRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts missing from ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-OF-KIRA-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
